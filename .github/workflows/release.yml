name: Release

on:
  push:
    tags:
      - "app-[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            os: windows-latest
            artifact: snippets-win-x64.zip
          - runtime: win-arm64
            os: windows-11-arm
            artifact: snippets-win-arm64.zip
          - runtime: linux-x64
            os: ubuntu-latest
            artifact: snippets-linux-x64.tar.gz
          - runtime: linux-arm64
            os: ubuntu-24.04-arm
            artifact: snippets-linux-arm64.tar.gz
          - runtime: osx-x64
            os: macos-15-intel
            artifact: snippets-osx-x64.tar.gz
          - runtime: osx-arm64
            os: macos-15
            artifact: snippets-osx-arm64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Derive version from tag
        shell: pwsh
        run: |
          $tag = "${env:GITHUB_REF_NAME}"
          $rx = '^app-(\d+(?:\.\d+)+)(?:-([a-z][a-z0-9]*))?$'
          if ($tag -cnotmatch $rx) {
            Write-Error "Tag '$tag' does not match 'app-{version}[-{suffix}]'."
            exit 1
          }

          $version = $Matches[1]
          $suffix = $Matches[2]
          $appVersion = if ($suffix) { "$version-$suffix" } else { $version }

          "APP_VERSION=$appVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ASM_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Snippets.slnx', 'src/**/*.csproj', 'tests/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore solution
        run: dotnet restore ./Snippets.slnx --runtime ${{ matrix.runtime }}

      - name: Run unit tests
        run: dotnet test ./tests/Snippets.Tests/Snippets.Tests.csproj --configuration Release --no-restore --nologo

      - name: Publish application
        if: ${{ !startsWith(matrix.runtime, 'osx-') }}
        shell: pwsh
        run: |
          dotnet publish ./src/Snippets.App/Snippets.App.csproj `
            --configuration Release `
            --runtime "${{ matrix.runtime }}" `
            --no-restore `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version="$env:APP_VERSION" `
            -p:AssemblyVersion="$env:ASM_VERSION" `
            -p:FileVersion="$env:ASM_VERSION" `
            -p:InformationalVersion="$env:APP_VERSION" `
            -p:IncludeSourceRevisionInInformationalVersion=false `
            -p:DebugSymbols=false `
            -p:DebugType=None `
            --output "publish/${{ matrix.runtime }}"

          if ($IsWindows) {
            Get-ChildItem "publish/${{ matrix.runtime }}" -Filter '*.pdb' -File -ErrorAction SilentlyContinue |
              Remove-Item -Force
          }

      - name: Publish macOS app bundle
        if: ${{ startsWith(matrix.runtime, 'osx-') }}
        shell: pwsh
        run: |
          $buildArgs = @{
            Runtime = "${{ matrix.runtime }}"
            SelfContained = $true
            NoRestore = $true
            Version = $env:APP_VERSION
            AssemblyVersion = $env:ASM_VERSION
            FileVersion = $env:ASM_VERSION
            InformationalVersion = $env:APP_VERSION
          }
          & ./tools/build.ps1 @buildArgs

      - name: Package Windows artifact
        if: ${{ startsWith(matrix.runtime, 'win-') }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive `
            -Path "publish/${{ matrix.runtime }}/*" `
            -DestinationPath "artifacts/${{ matrix.artifact }}" `
            -Force

      - name: Package Linux artifact
        if: ${{ startsWith(matrix.runtime, 'linux-') }}
        shell: bash
        run: |
          mkdir -p artifacts
          tar -czf "artifacts/${{ matrix.artifact }}" -C "publish/${{ matrix.runtime }}" .

      - name: Package macOS app bundle
        if: ${{ startsWith(matrix.runtime, 'osx-') }}
        shell: bash
        run: |
          mkdir -p artifacts
          tar -czf "artifacts/${{ matrix.artifact }}" -C "dist/${{ matrix.runtime }}" Snippets.app

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.runtime }}
          path: artifacts/${{ matrix.artifact }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !contains(github.ref_name, '-test') && !contains(github.ref_name, '-debug') }}
    permissions:
      contents: write

    steps:
      - name: Derive release metadata from tag
        id: metadata
        shell: pwsh
        run: |
          $tag = "${env:GITHUB_REF_NAME}"
          $rx = '^app-(\d+(?:\.\d+)+)(?:-([a-z][a-z0-9]*))?$'
          if ($tag -cnotmatch $rx) {
            Write-Error "Tag '$tag' does not match 'app-{version}[-{suffix}]'."
            exit 1
          }

          $version = $Matches[1]
          $suffix = $Matches[2]
          $releaseName = if ($suffix) { "$version-$suffix" } else { $version }
          $isPrerelease = [string]::IsNullOrEmpty($suffix) -eq $false

          "release_name=$releaseName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "is_prerelease=$($isPrerelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: release-*
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.metadata.outputs.release_name }}
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.metadata.outputs.is_prerelease }}
          fail_on_unmatched_files: true
